# Codemagic: builds an UNSIGNED iPhone app (.ipa) on a free Mac for sideloading with Sideloadly/AltStore.
# In Codemagic: add this repo → pick the "ios-build" branch → workflow "iOS sideload build" → Start new build.
# Free personal plan: 500 macOS M2 minutes/month; one build takes roughly 5–10 minutes.
workflows:
  ios-sideload:
    name: iOS sideload build (unsigned .ipa)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build the web game into www/
        script: npm run build
      - name: Create / sync the iOS project
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Icon, launch screen, full-screen settings
        script: bash scripts/ios-customize.sh
      - name: Build the app (no code signing; Sideloadly signs it with your Apple ID)
        script: |
          set -eo pipefail
          if [ -d ios/App/App.xcworkspace ]; then TARGET=(-workspace ios/App/App.xcworkspace); else TARGET=(-project ios/App/App.xcodeproj); fi
          xcodebuild "${TARGET[@]}" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet
      - name: Package the .ipa
        script: |
          set -e
          APP=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry NeonPong-unsigned.ipa Payload
          ls -lh NeonPong-unsigned.ipa
    artifacts:
      - build/*.ipa
